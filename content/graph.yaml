    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-r:
    type: step
    title: Шалтери, слово Р
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-s:
    type: step
    title: Шалтери, слово С
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-t:
    type: step
    title: Шалтери, слово Т
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-tj:
    type: step
    title: Шалтери, слово Ћ
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-u:
    type: step
    title: Шалтери, слово У
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-c:
    type: step
    title: Шалтери, слово Ц
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-ch:
    type: step
    title: Шалтери, слово Ч
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-sh:
    type: step
    title: Шалтери, слово Ш
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-card:
    type: card
    title: Покажите ово на шалтеру
    group: Апликација ConsentID
    next: activate-consentid

  activate-consentid:
    type: step
    title: Активирајте апликацију и смислите ПИН
    group: Апликација ConsentID
    next: scan-qr-code

  scan-qr-code:
    type: step
    title: Скенирајте QR код са потврде
    group: Апликација ConsentID
    answers:
      - label: Апликација је активирана
        next: cloud-certificate
      - label: Нисам успео/ла
        next: help-account

  cloud-certificate:
    type: step
    title: Укључите потпис у клауду
    group: Апликација ConsentID
    answers:
      - label: Хоћу да га укључим сада
        next: cloud-login
      - label: Урадићу касније
        next: done

  cloud-login:
    type: step
    title: Пријавите се на сајт eid.gov.rs
    group: Апликација ConsentID
    external:
      label: Отворите пријаву на eid.gov.rs
      url: https://eid.gov.rs/sr-Cyrl-RS/eid
    answers:
      - label: Урадио/ла сам
        next: cloud-approve
      - label: Не могу да се пријавим
        next: help-account

  cloud-approve:
    type: step
    title: Потврдите пријаву у апликацији ConsentID
    group: Апликација ConsentID
    answers:
      - label: Пријављен/а сам
        next: cloud-issue
      - label: Време је истекло
        next: cloud-login
      - label: Заборавио/ла сам ПИН
        next: help-account

  cloud-issue:
    type: step
    title: Укључите потпис у клауду на сајту
    group: Апликација ConsentID
    external:
      label: Отворите сајт eid.gov.rs
      url: https://eid.gov.rs/
    answers:
      - label: Потпис у клауду је активан
        next: done
      - label: Није успело
        next: cloud-check-login

  cloud-check-login:
    type: step
    title: Проверите да ли сте пријављени
    group: Апликација ConsentID
    external:
      label: Отворите сајт eid.gov.rs
      url: https://eid.gov.rs/
    answers:
      - label: Нисам пријављен/а
        next: cloud-login
      - label: Пријављен/а сам, покушаћу поново
        next: cloud-issue
      - label: Пријављен/а сам, а и даље не иде
        next: help-account
      - label: Потпис у клауду је већ активан
        next: done

  # --- Крај ---------------------------------------------------------------
  done:
    type: end
    title: Честитамо, сада сте еГрађанин

  done-basic:
    type: end
    title: Имате налог за основне услуге

  help-id-card:
    type: end
    title: Прво вам треба лична карта или пасош

  help-email:
    type: end
    title: Треба вам имејл адреса

  help-technical:
    type: end
    title: Страница или апликација не ради

  help-account:
    type: end
    title: Затражите помоћ за налог
