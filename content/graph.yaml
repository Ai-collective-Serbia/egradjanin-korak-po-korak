# Registration flow for the eID portal (eid.gov.rs), the account used for eUprava.
# Order of steps follows the team's test run on a phone and the official guide
# "Упутство за регистрацију корисничким именом и лозинком".
# Node ids are English, lowercase, hyphenated. All text is Cyrillic.
start: about-guide

nodes:
  # --- Увод ---------------------------------------------------------------
  about-guide:
    type: step
    title: Шта је овај водич
    group: Увод
    answers:
      - label: Почните
        next: welcome

  welcome:
    type: step
    title: Постаните еГрађанин
    group: Увод
    answers:
      - label: Почните регистрацију
        next: what-you-need
      - label: Већ имам налог
        next: have-smartphone

  # --- Припрема -----------------------------------------------------------
  what-you-need:
    type: step
    title: Шта вам треба да почнете
    group: Припрема
    next: switch-tabs

  switch-tabs:
    type: step
    title: Како да прелазите између картица
    group: Припрема
    next: have-id-card

  have-id-card:
    type: question
    title: Да ли имате важећу личну карту или пасош?
    group: Припрема
    answers:
      - label: Да
        next: have-email
      - label: Не
        next: how-to-get-id-card
      - label: Нисам сигуран/на
        next: check-id-card

  check-id-card:
    type: step
    title: Како да проверите да ли вам лична карта важи
    group: Припрема
    answers:
      - label: Важи
        next: have-email
      - label: Не важи
        next: how-to-get-id-card

  how-to-get-id-card:
    type: step
    title: Како да добијете нову личну карту
    group: Припрема
    external:
      label: Отворите упутство полиције
      url: https://www.mup.gov.rs/wps/portal/sr/gradjani/dokumenta/licna%20karta/vadjenje%20licne%20karte
    answers:
      - label: Добио/ла сам нову личну карту
        next: have-email
      - label: Треба ми помоћ
        next: help-id-card

  have-email:
    type: question
    title: Да ли имате имејл адресу?
    group: Припрема
    answers:
      - label: Да
        next: prepare-id-photos
      - label: Не
        next: create-email

  create-email:
    type: step
    title: Направите имејл адресу
    group: Припрема
    external:
      label: Отворите Gmail
      url: https://accounts.google.com/signup
    answers:
      - label: Урадио/ла сам
        next: prepare-id-photos
      - label: Нисам успео/ла
        next: help-email

  # --- Регистрација -------------------------------------------------------
  prepare-id-photos:
    type: step
    title: Фотографишите личну карту са обе стране
    group: Регистрација
    next: register-open

  register-open:
    type: step
    title: Отворите страницу за регистрацију
    group: Регистрација
    external:
      label: Отворите регистрацију
      url: https://registracija.eid.gov.rs/sr-Cyrl-RS/kreiranje-naloga?userCategory=Serbian
    answers:
      - label: Видим формулар
        next: register-upload
      - label: Страница се не отвара
        next: help-technical

  register-upload:
    type: step
    title: Приложите фотографије личне карте
    group: Регистрација
    answers:
      - label: Приложио/ла сам фотографије
        next: register-personal-data
      - label: Не могу да приложим фотографије
        next: help-upload

  help-upload:
    type: step
    title: Ако не можете да приложите фотографије
    group: Регистрација
    answers:
      - label: Сада је успело
        next: register-personal-data
      - label: И даље не могу
        next: help-account

  register-personal-data:
    type: step
    title: Упишите своје податке
    group: Регистрација
    next: register-document-data

  register-document-data:
    type: step
    title: Упишите податке о личној карти
    group: Регистрација
    next: register-login-data

  register-login-data:
    type: step
    title: Упишите имејл и смислите лозинку
    group: Регистрација
    next: register-submit

  register-submit:
    type: step
    title: Потврдите и пошаљите
    group: Регистрација
    answers:
      - label: Пише да је захтев послат
        next: confirm-email
      - label: Појавила се грешка
        next: register-error

  register-error:
    type: step
    title: Шта да урадите ако се појави грешка
    group: Регистрација
    answers:
      - label: Сада је успело
        next: confirm-email
      - label: Већ сам регистрован/а
        next: confirm-email
      - label: Пише да је ЈМБГ у употреби
        next: help-account
      - label: И даље не ради
        next: help-account

  # --- Активација налога --------------------------------------------------
  confirm-email:
    type: step
    title: Потврдите имејл адресу
    group: Активација налога
    external:
      label: Отворите Gmail
      url: https://mail.google.com/
    answers:
      - label: Притиснуо/ла сам „Потврди“
        next: wait-activation
      - label: Порука није стигла
        next: email-missing

  email-missing:
    type: step
    title: Порука није стигла
    group: Активација налога
    external:
      label: Отворите Gmail
      url: https://mail.google.com/
    answers:
      - label: Нашао/ла сам поруку
        next: confirm-email
      - label: Погрешио/ла сам адресу
        next: register-open
      - label: Прошло је више од 24 сата
        next: register-open
      - label: Нема је ни после пола сата
        next: help-account

  wait-activation:
    type: step
    title: Сачекајте да вам активирају налог
    group: Активација налога
    answers:
      - label: Стигла је порука да је налог активан
        next: account-ready
      - label: Прошло је више од 48 сати
        next: help-account

  account-ready:
    type: step
    title: Ваш налог је активан
    group: Активација налога
    next: have-smartphone

  # --- ConsentID ----------------------------------------------------------
  have-smartphone:
    type: question
    title: Да ли имате паметни телефон?
    group: Апликација ConsentID
    answers:
      - label: Да
        next: install-consentid
      - label: Не
        next: done-basic

  install-consentid:
    type: step
    title: Инсталирајте апликацију ConsentID
    group: Апликација ConsentID
    answers:
      - label: Инсталирао/ла сам
        next: find-counter
      - label: Не могу да је нађем
        next: help-technical

  find-counter:
    type: step
    title: Идите на шалтер по QR код
    group: Апликација ConsentID
    answers:
      - label: Хоћу списак шалтера
        next: counter-list
      - label: Знам где ћу ићи
        next: counter-card

  counter-list:
    type: question
    title: Којим словом почиње име вашег места?
    group: Апликација ConsentID
    answers:
      - label: "А: Ада, Александровац…"
        next: counter-list-a
      - label: "Б: Београд, Бор, Бачка Паланка…"
        next: counter-list-b
      - label: "В: Ваљево, Варварин…"
        next: counter-list-v
      - label: "Г: Гаџин Хан, Гњилане…"
        next: counter-list-g
      - label: "Д: Деспотовац, Димитровград…"
        next: counter-list-d
      - label: "Ж: Жабаљ, Жабари…"
        next: counter-list-zh
      - label: "З: Зајечар, Звечан…"
        next: counter-list-z
      - label: "И: Ивањица, Инђија…"
        next: counter-list-i
      - label: "Ј: Јагодина"
        next: counter-list-j
      - label: "К: Кањижа, Кикинда…"
        next: counter-list-k
      - label: "Л: Лајковац, Лапово…"
        next: counter-list-l
      - label: "Љ: Љиг, Љубовија"
        next: counter-list-lj
      - label: "М: Мајданпек, Мали Зворник…"
        next: counter-list-m
      - label: "Н: Ниш, Нови Сад, Нови Пазар…"
        next: counter-list-n
      - label: "О: Опово, Ораховац…"
        next: counter-list-o
      - label: "П: Панчево, Параћин…"
        next: counter-list-p
      - label: "Р: Ражањ, Рача…"
        next: counter-list-r
      - label: "С: Свилајнац, Сврљиг…"
        next: counter-list-s
      - label: "Т: Темерин, Тител…"
        next: counter-list-t
      - label: "Ћ: Ћићевац, Ћуприја"
        next: counter-list-tj
      - label: "У: Уб, Ужице"
        next: counter-list-u
      - label: "Ц: Црна Трава"
        next: counter-list-c
      - label: "Ч: Чајетина, Чачак…"
        next: counter-list-ch
      - label: "Ш: Шабац, Шид…"
        next: counter-list-sh

  counter-list-a:
    type: step
    title: Шалтери, слово А
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-b:
    type: step
    title: Шалтери, слово Б
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-v:
    type: step
    title: Шалтери, слово В
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-g:
    type: step
    title: Шалтери, слово Г
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-d:
    type: step
    title: Шалтери, слово Д
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-zh:
    type: step
    title: Шалтери, слово Ж
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-z:
    type: step
    title: Шалтери, слово З
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-i:
    type: step
    title: Шалтери, слово И
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-j:
    type: step
    title: Шалтери, слово Ј
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-k:
    type: step
    title: Шалтери, слово К
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-l:
    type: step
    title: Шалтери, слово Л
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-lj:
    type: step
    title: Шалтери, слово Љ
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-m:
    type: step
    title: Шалтери, слово М
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-n:
    type: step
    title: Шалтери, слово Н
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
      - label: Изаберите друго слово
        next: counter-list

  counter-list-o:
    type: step
    title: Шалтери, слово О
    group: Апликација ConsentID
    answers:
      - label: Нашао/ла сам шалтер
        next: counter-card
